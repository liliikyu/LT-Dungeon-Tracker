name: Sync Dungeon Achievements

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/sync_achievements.py"
      - ".github/workflows/sync-achievements.yml"
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh Dungeon Achievements from Official La Tale Wiki
        run: python scripts/sync_achievements.py
      - name: Commit changed Dungeon Achievement data
        shell: bash
        run: |
          if git diff --quiet -- assets/dungeon-achievements.js; then
            echo "No Dungeon Achievement changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/dungeon-achievements.js
          git commit -m "Sync dungeon achievements from La Tale Wiki"
          git push
