name: Validate material sources
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: python -m unittest discover -s scripts -p 'test_*.py'
      - run: node scripts/test_material_sources.cjs
      - run: node scripts/test_inventory_allocation.cjs
      - run: node --check assets/material-sources.js && node --check assets/item-upgrade.js
