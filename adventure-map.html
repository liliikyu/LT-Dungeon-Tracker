<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <link rel="icon" type="image/x-icon" href="favicon.ico?v=13.9.4.31">
  <title>Latale Adventure Map</title>
  <link rel="stylesheet" href="assets/styles.css?v=13.9.4.150-approx-stage">
  <style>
    .adventure-page{padding-top:18px;padding-bottom:28px}
    .adventure-hero{margin-bottom:14px}
    .adventure-hero h1{margin:0 0 6px;font-size:22px}
    .adventure-hero p{margin:0;color:var(--muted)}
    .adventure-viewer{
      border:1px solid var(--line);
      border-radius:12px;
      background:var(--panel);
      padding:14px;
    }
    .adventure-board-frame{
      display:flex;
      justify-content:center;
      align-items:center;
      min-height:260px;
      overflow:hidden;
      border:1px solid var(--line-soft);
      border-radius:10px;
      background:var(--panel-2);
      padding:12px;
    }
    #adventure-board{
      display:block;
      width:min(100%,760px);
      height:auto;
      aspect-ratio:292 / 204;
      image-rendering:auto;
    }
    .adventure-controls{
      display:grid;
      grid-template-columns:auto minmax(0,1fr) auto;
      gap:10px;
      align-items:center;
      margin-top:12px;
    }
    .adventure-nav-button{
      min-width:48px;
      height:40px;
      border:1px solid var(--line);
      border-radius:8px;
      background:var(--panel-2);
      color:var(--text);
      font-size:24px;
      font-weight:800;
      cursor:pointer;
    }
    .adventure-nav-button:hover{border-color:var(--accent)}
    .adventure-board-count{
      text-align:center;
      color:var(--muted);
      font-size:12px;
      font-weight:750;
    }
    .adventure-board-count strong{color:var(--text)}
    @media(max-width:760px){
      .adventure-page{padding-top:12px}
      .adventure-hero h1{font-size:18px}
      .adventure-viewer{padding:8px;border-radius:9px}
      .adventure-board-frame{min-height:0;padding:6px}
      .adventure-nav-button{height:38px}
    }
    .adventure-lock-overlay{
      position:fixed;
      inset:0;
      z-index:9999;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
      background:rgba(8,13,22,.94);
      backdrop-filter:blur(8px);
    }
    .adventure-lock-overlay.hidden{display:none}
    .adventure-lock-card{
      width:min(100%,380px);
      border:1px solid var(--line);
      border-radius:14px;
      background:var(--panel);
      padding:20px;
      box-shadow:0 20px 60px rgba(0,0,0,.35);
    }
    .adventure-lock-card h2{margin:0 0 8px;font-size:20px}
    .adventure-lock-card p{margin:0 0 14px;color:var(--muted);font-size:13px}
    .adventure-lock-card input{
      width:100%;
      box-sizing:border-box;
      min-height:42px;
      border:1px solid var(--line);
      border-radius:8px;
      background:var(--panel-2);
      color:var(--text);
      padding:0 12px;
    }
    .adventure-lock-card button{
      width:100%;
      min-height:42px;
      margin-top:10px;
      border:1px solid var(--accent);
      border-radius:8px;
      background:var(--accent-soft);
      color:var(--text);
      font-weight:750;
      cursor:pointer;
    }
    .adventure-lock-error{
      min-height:18px;
      margin-top:8px;
      color:#e66;
      font-size:12px;
    }
  </style>
</head>
<body class="extra-tools-page">
  <div id="adventure-lock" class="adventure-lock-overlay" aria-hidden="false">
    <section class="adventure-lock-card" role="dialog" aria-modal="true" aria-labelledby="adventure-lock-title">
      <h2 id="adventure-lock-title">Adventure Map</h2>
      <p>Enter the password to continue.</p>
      <form id="adventure-lock-form">
        <input id="adventure-lock-input" type="password" autocomplete="current-password" aria-label="Password" autofocus>
        <button type="submit">Unlock</button>
        <div id="adventure-lock-error" class="adventure-lock-error" aria-live="polite"></div>
      </form>
    </section>
  </div>
  <header class="topbar">
    <div class="shell topbar-inner">
      <a class="brand" href="adventure-map.html" aria-label="Latale Adventure Map">
        <span class="brand-mark"><img src="assets/favicon-purple.png?v=13.9.4.31" alt="" aria-hidden="true"></span>
        <span><strong>Latale Adventure Map</strong></span>
      </a>
      <nav class="extra-tools-nav" aria-label="Extra tool navigation">
        <a class="extra-back-link" href="fields.html">← Latale Fanmade Illustration Book</a>
        <a class="extra-back-link" href="item-upgrade.html">Item Upgrade Tracker</a>
      </nav>
      <div class="topbar-actions">
        <button id="theme-toggle" class="icon-button" type="button" aria-label="Theme: System. Click to switch theme." title="Theme: System">◐</button>
      </div>
    </div>
  </header>
  <main class="shell adventure-page">
    <section class="adventure-hero">
      <h1>Adventure Map</h1>
      <p>View one adventure board at a time. Use the arrows to move between boards.</p>
    </section>
    <section class="adventure-viewer" aria-label="Adventure board viewer">
      <div class="adventure-board-frame">
        <canvas id="adventure-board" width="584" height="408" aria-label="Adventure board 1"></canvas>
      </div>
      <div class="adventure-controls">
        <button id="adventure-prev" class="adventure-nav-button" type="button" aria-label="Previous board">‹</button>
        <div class="adventure-board-count"><strong id="adventure-board-label">Board 1</strong> / 56</div>
        <button id="adventure-next" class="adventure-nav-button" type="button" aria-label="Next board">›</button>
      </div>
      <img id="adventure-source" src="assets/adventure-map.jpg?v=2" alt="" hidden>
    </section>
  </main>
  <script>
    (() => {
      const EXPECTED_HASH="b3303798ccfe8acd96650ee1801b5a1d87c464871d8fe61a6f070949adbc8ef6";
      const SESSION_KEY="latale-adventure-map-unlocked-v1";
      const overlay=document.getElementById("adventure-lock");
      const form=document.getElementById("adventure-lock-form");
      const input=document.getElementById("adventure-lock-input");
      const error=document.getElementById("adventure-lock-error");

      const toHex=buffer=>[...new Uint8Array(buffer)].map(b=>b.toString(16).padStart(2,"0")).join("");
      const hashText=async value=>toHex(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(value)));

      const unlock=()=>{
        overlay.classList.add("hidden");
        overlay.setAttribute("aria-hidden","true");
        try{sessionStorage.setItem(SESSION_KEY,"1")}catch{}
      };

      try{
        if(sessionStorage.getItem(SESSION_KEY)==="1")unlock();
      }catch{}

      form.addEventListener("submit",async event=>{
        event.preventDefault();
        error.textContent="";
        const value=input.value;
        if(!value)return;
        const digest=await hashText(value);
        if(digest===EXPECTED_HASH){
          input.value="";
          unlock();
        }else{
          error.textContent="Incorrect password.";
          input.select();
        }
      });
    })();
  </script>

  <script>
    (() => {
      const COLS=7, ROWS=8, TOTAL=COLS*ROWS;
      const img=document.getElementById("adventure-source");
      const canvas=document.getElementById("adventure-board");
      const ctx=canvas.getContext("2d");
      const label=document.getElementById("adventure-board-label");
      const prev=document.getElementById("adventure-prev");
      const next=document.getElementById("adventure-next");
      let board=0;

      function draw(){
        if(!img.complete || !img.naturalWidth)return;
        const col=board%COLS,row=Math.floor(board/COLS);
        const x0=Math.round(col*img.naturalWidth/COLS);
        const x1=Math.round((col+1)*img.naturalWidth/COLS);
        const y0=Math.round(row*img.naturalHeight/ROWS);
        const y1=Math.round((row+1)*img.naturalHeight/ROWS);
        const sw=x1-x0,sh=y1-y0;

        canvas.width=sw*2;
        canvas.height=sh*2;
        ctx.imageSmoothingEnabled=true;
        ctx.imageSmoothingQuality="high";
        ctx.clearRect(0,0,canvas.width,canvas.height);
        ctx.drawImage(img,x0,y0,sw,sh,0,0,canvas.width,canvas.height);

        label.textContent="Board "+(board+1);
        canvas.setAttribute("aria-label","Adventure board "+(board+1));
        prev.disabled=board===0;
        next.disabled=board===TOTAL-1;
      }

      prev.addEventListener("click",()=>{if(board>0){board--;draw();}});
      next.addEventListener("click",()=>{if(board<TOTAL-1){board++;draw();}});
      document.addEventListener("keydown",event=>{
        if(event.key==="ArrowLeft"&&board>0){board--;draw();}
        if(event.key==="ArrowRight"&&board<TOTAL-1){board++;draw();}
      });
      img.addEventListener("load",draw);
      if(img.complete)draw();
    })();
  </script>
  <script src="assets/global-header.js?v=13.9.4.85-soft-ex"></script>
</body>
</html>
