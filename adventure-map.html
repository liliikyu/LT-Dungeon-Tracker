<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <script src="assets/adventure-game/theme.js?v=theme-12"></script>
  <link rel="icon" type="image/x-icon" href="assets/moul.ico?v=moul-1">
  <title>Latale Adventure Map</title>
  <link rel="stylesheet" href="assets/styles.css?v=13.9.4.150-approx-stage">
  <style>
    .adventure-page{padding-top:14px;padding-bottom:28px}
    #adventure-game{display:block;width:100%;height:1250px;border:0;background:transparent}
    .adventure-lock-overlay{
      position:fixed;
      inset:0;
      z-index:9999;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
      background:rgba(8,13,22,.94);
      backdrop-filter:blur(8px);
    }
    .adventure-lock-overlay.hidden{display:none}
    .adventure-lock-card{
      width:min(100%,380px);
      border:1px solid var(--line);
      border-radius:14px;
      background:var(--panel);
      padding:20px;
      box-shadow:0 20px 60px rgba(0,0,0,.35);
    }
    .adventure-lock-card h2{margin:0 0 8px;font-size:20px}
    .adventure-lock-card p{margin:0 0 14px;color:var(--muted);font-size:13px}
    .adventure-lock-card input{
      width:100%;
      box-sizing:border-box;
      min-height:42px;
      border:1px solid var(--line);
      border-radius:8px;
      background:var(--panel-2);
      color:var(--text);
      padding:0 12px;
    }
    .adventure-lock-card button{
      width:100%;
      min-height:42px;
      margin-top:10px;
      border:1px solid var(--accent);
      border-radius:8px;
      background:var(--accent-soft);
      color:var(--text);
      font-weight:750;
      cursor:pointer;
    }
    .adventure-lock-error{
      min-height:18px;
      margin-top:8px;
      color:#e66;
      font-size:12px;
    }
  </style>
</head>
<body class="extra-tools-page">
  <div id="adventure-lock" class="adventure-lock-overlay" aria-hidden="false">
    <section class="adventure-lock-card" role="dialog" aria-modal="true" aria-labelledby="adventure-lock-title">
      <h2 id="adventure-lock-title">Adventure Map</h2>
      <p>Enter the password to continue.</p>
      <form id="adventure-lock-form">
        <input id="adventure-lock-input" type="password" autocomplete="current-password" aria-label="Password" autofocus>
        <button type="submit">Unlock</button>
        <div id="adventure-lock-error" class="adventure-lock-error" aria-live="polite"></div>
      </form>
    </section>
  </div>
  <header class="topbar">
    <div class="shell topbar-inner">
      <a class="brand" href="adventure-map.html" aria-label="Latale Adventure Map">
        <span class="brand-mark"><img src="assets/moul.ico?v=moul-1" alt="" aria-hidden="true"></span>
        <span><strong>Latale Adventure Map</strong></span>
      </a>
      <nav class="extra-tools-nav" aria-label="Extra tool navigation">
        <a class="extra-back-link" href="fields.html">← Latale Fanmade Illustration Book</a>
        <a class="extra-back-link" href="item-upgrade.html">Item Upgrade Tracker</a>
      </nav>
      <div class="topbar-actions">
        <button id="theme-toggle" class="icon-button" type="button" aria-label="Theme: System. Click to switch theme." title="Theme: System">◐</button>
      </div>
    </div>
  </header>
  <main class="shell adventure-page" id="adventure-content" inert>
    <iframe id="adventure-game" title="Interactive Adventure Map — move your character through 62 boards" data-src="assets/adventure-game/index.html?v=avatar-glow-15"></iframe>
    <noscript>Enable JavaScript to unlock and play the interactive adventure map.</noscript>
  </main>
  <script>
    (() => {
      const EXPECTED_HASH="b3303798ccfe8acd96650ee1801b5a1d87c464871d8fe61a6f070949adbc8ef6";
      const SESSION_KEY="latale-adventure-map-unlocked-v1";
      const overlay=document.getElementById("adventure-lock");
      const form=document.getElementById("adventure-lock-form");
      const input=document.getElementById("adventure-lock-input");
      const error=document.getElementById("adventure-lock-error");

      const toHex=buffer=>[...new Uint8Array(buffer)].map(b=>b.toString(16).padStart(2,"0")).join("");
      const hashText=async value=>toHex(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(value)));

      const unlock=()=>{
        const frame=document.getElementById("adventure-game");
        if(!frame.getAttribute("src"))frame.src=frame.dataset.src;
        document.getElementById("adventure-content").inert=false;
        overlay.classList.add("hidden");
        overlay.setAttribute("aria-hidden","true");
        try{sessionStorage.setItem(SESSION_KEY,"1")}catch{}
      };

      try{
        if(sessionStorage.getItem(SESSION_KEY)==="1")unlock();
      }catch{}

      form.addEventListener("submit",async event=>{
        event.preventDefault();
        error.textContent="";
        const value=input.value;
        if(!value)return;
        const digest=await hashText(value);
        if(digest===EXPECTED_HASH){
          input.value="";
          unlock();
        }else{
          error.textContent="Incorrect password.";
          input.select();
        }
      });
    })();
  </script>

  <script>
    (() => {
      const frame=document.getElementById("adventure-game");
      window.addEventListener("message",event=>{
        if(event.origin!==location.origin || event.source!==frame.contentWindow)return;
        if(event.data?.type!=="adventure:height")return;
        const height=Number(event.data.height);
        if(Number.isFinite(height) && height>=300 && height<=10000)frame.style.height=(Math.ceil(height)+2)+"px";
      });
    })();
  </script>
  <script src="assets/global-header.js?v=13.9.4.85-soft-ex"></script>
</body>
</html>
